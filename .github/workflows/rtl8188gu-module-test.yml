name: RTL8188GU external-module compatibility test

on:
  workflow_dispatch:
  push:
    branches:
      - rtl8188gu-actions-test
    paths:
      - ".github/workflows/rtl8188gu-module-test.yml"
      - "build.sh"
      - "configs/gki_defconfig.sh"
      - "patches/0001-feat-escape-persistent_allow_list-to-kthread.patch"
      - "scripts/restrict-rtl8xxxu-usb-ids.py"

permissions:
  contents: read

concurrency:
  group: rtl8188gu-module-test
  cancel-in-progress: false

jobs:
  build-and-check:
    name: Build GKID 6.1.177 and test RTL8188GU module
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      KERNEL_REPO: https://github.com/KRYPTAJUNO/GKI-Duchamp-6.1
      KERNEL_BRANCH_OVERRIDE: rtl8188gu-build-base-f391d5a36
      KERNEL_LOCALVERSION_OVERRIDE: -GKID-r663-f391d5a36
      KERNEL_VERSION: "6.1"
      KSU: KSU
      KSU_COMPAT: "false"
      KSU_SUSFS: "true"
      C_LTO: "true"
      No_DS: "false"
      TODO: kernel
      TEST: "no"
      LTO: fullLTO
      CLEAN_LTO_CACHE: "true"
      DROIDSPACES: "false"
      NH: "true"
      NM: "false"
      RUN_NUM: -r663
      SKIP_ANYKERNEL_PACKAGE: "true"
      RTL8XXXU_COMMIT: b6411d673759740b5cf94f150937383dc2efeda6
      RTL8XXXU_IN_TREE: "true"
      EXPECTED_KERNEL_SOURCE: f391d5a36ae325a4f3abdf497335abae87734a05

    steps:
      - name: Checkout isolated builder branch
        uses: actions/checkout@v4
        with:
          ref: rtl8188gu-actions-test
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libdw-dev libelf-dev libssl-dev libncurses-dev \
            ccache gh dwarves cpio zip unzip zstd kmod binutils-aarch64-linux-gnu \
            gcc-aarch64-linux-gnu
          python3 -m pip install lxml

      - name: Build the matching GKID kernel tree on the disposable runner
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p module-test-artifacts
          chmod +x ./*.sh py/*.py
          set +e
          ./build.sh
          BUILD_STATUS=$?
          set -e
          if [ -s artifacts/build.log ]; then
            cp artifacts/build.log module-test-artifacts/kernel-build.log
          else
            printf 'build.sh exited with status %s; artifacts/build.log was not created.\n' "$BUILD_STATUS" > module-test-artifacts/kernel-build.log
          fi
          {
            echo "Build exit status: $BUILD_STATUS"
            echo "Runner: $(uname -a)"
            echo "Disk space:"
            df -h
            echo "Memory:"
            free -h
          } > module-test-artifacts/runner-diagnostics.txt
          exit "$BUILD_STATUS"

      - name: Build and verify in-tree RTL8XXXU and RTL8188GU modules
        shell: bash
        run: |
          set -euo pipefail
          DRIVER_DIR="$GITHUB_WORKSPACE/rtl8xxxu-src"
          mkdir -p module-test-artifacts

          test "$(git -C ksrc rev-parse HEAD)" = "$EXPECTED_KERNEL_SOURCE"
          test -s out/.config
          test -s out/Module.symvers
          test -s out/include/config/auto.conf

          grep -qx 'CONFIG_MODULES=y' out/.config
          grep -qx 'CONFIG_MODVERSIONS=y' out/.config
          grep -qx 'CONFIG_WLAN=y' out/.config
          grep -qx 'CONFIG_CFG80211=m' out/.config
          grep -qx 'CONFIG_MAC80211=m' out/.config
          grep -qx 'CONFIG_USB=y' out/.config
          grep -qx 'CONFIG_WLAN_VENDOR_REALTEK=y' out/.config
          grep -qx 'CONFIG_RTL8XXXU=m' out/.config
          export PATH="$GITHUB_WORKSPACE/neutron-clang/bin:$PATH"
          make -C "$GITHUB_WORKSPACE/ksrc" \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache clang" \
            modules 2>&1 | tee module-test-artifacts/in-tree-rtl8xxxu-build.log
          IN_TREE_MODULE="out/drivers/net/wireless/realtek/rtl8xxxu/rtl8xxxu.ko"
          test -s "$IN_TREE_MODULE"
          modinfo -F vermagic "$IN_TREE_MODULE" | grep -q '^6.1.177-GKID-r663-f391d5a36 '
          cp "$IN_TREE_MODULE" module-test-artifacts/

          git clone --filter=blob:none https://github.com/lwfinger/rtl8xxxu.git "$DRIVER_DIR"
          git -C "$DRIVER_DIR" checkout --detach "$RTL8XXXU_COMMIT"
          test "$(git -C "$DRIVER_DIR" rev-parse HEAD)" = "$RTL8XXXU_COMMIT"
          python3 scripts/restrict-rtl8xxxu-usb-ids.py

          export PATH="$GITHUB_WORKSPACE/neutron-clang/bin:$PATH"
          make -C "$GITHUB_WORKSPACE/ksrc" \
            O="$GITHUB_WORKSPACE/out" \
            M="$DRIVER_DIR" \
            ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache clang" \
            modules 2>&1 | tee module-test-artifacts/module-build.log

          MODULE="$DRIVER_DIR/rtl8xxxu_git.ko"
          test -s "$MODULE"

          KERNEL_RELEASE="$(make -s -C ksrc O="$GITHUB_WORKSPACE/out" kernelrelease)"
          MODULE_VERMAGIC="$(modinfo -F vermagic "$MODULE")"
          MODULE_RELEASE="${MODULE_VERMAGIC%% *}"
          test "$MODULE_RELEASE" = "$KERNEL_RELEASE"

          modinfo -F alias "$MODULE" | grep -Eiq '^usb:v0BDApB711'
          test "$(modinfo -F alias "$MODULE" | wc -l)" -eq 1
          readelf -h "$MODULE" | grep -q 'AArch64'

          python3 - <<'PY'
          import pathlib, re, subprocess, sys
          target = re.compile(r"usb:v0BDApB711", re.I)
          collisions = []
          for module in pathlib.Path("out").rglob("*.ko"):
              result = subprocess.run(
                  ["modinfo", "-F", "alias", str(module)],
                  text=True, capture_output=True, check=False
              )
              if any(target.search(line) for line in result.stdout.splitlines()):
                  collisions.append(str(module))
          if collisions:
              print("USB ID collision in existing kernel modules:", *collisions, sep="\\n")
              sys.exit(1)
          print("No existing kernel-module alias collision for USB ID 0bda:b711.")
          PY

          test -s "$DRIVER_DIR/firmware/rtl8710bufw_SMIC.bin"
          test -s "$DRIVER_DIR/firmware/rtl8710bufw_UMC.bin"
          test -s "$DRIVER_DIR/firmware/LICENCE.rtlwifi_firmware.txt"
          mkdir -p module-test-artifacts/firmware/rtlwifi
          cp "$DRIVER_DIR/firmware/rtl8710bufw_SMIC.bin" "$DRIVER_DIR/firmware/rtl8710bufw_UMC.bin" module-test-artifacts/firmware/rtlwifi/
          cp "$DRIVER_DIR/firmware/LICENCE.rtlwifi_firmware.txt" module-test-artifacts/firmware/
          sha256sum module-test-artifacts/firmware/rtlwifi/* module-test-artifacts/firmware/LICENCE.rtlwifi_firmware.txt > module-test-artifacts/firmware/SHA256SUMS

          {
            echo "Kernel release: $KERNEL_RELEASE"
            echo "Module vermagic: $MODULE_VERMAGIC"
            echo "Driver commit: $RTL8XXXU_COMMIT"
            echo "Kernel source commit: $(git -C ksrc rev-parse HEAD)"
            echo "USB aliases:"
            modinfo -F alias "$MODULE"
            echo "USB alias count: $(modinfo -F alias "$MODULE" | wc -l)"
            echo "Firmware declarations:"
            modinfo -F firmware "$MODULE"
            echo "Dependencies:"
            modinfo -F depends "$MODULE"
          } | tee module-test-artifacts/module-metadata.txt

          cp "$MODULE" module-test-artifacts/
          cp out/.config module-test-artifacts/kernel-config.txt
          cp artifacts/build.log module-test-artifacts/kernel-build.log

      - name: Upload compile-only test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtl8188gu-gkid-6.1.177-compile-test
          path: |
            module-test-artifacts/
            artifacts/build.log
          if-no-files-found: warn
          retention-days: 14
