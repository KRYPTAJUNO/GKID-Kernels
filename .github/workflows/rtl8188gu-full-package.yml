name: GKID 6.1.177 RTL8188GU standalone module build

on:
  workflow_dispatch:
  push:
    branches:
      - rtl8188gu-full-package
      - recovery/rtl8188gu-build-diagnostics
    paths:
      - ".github/workflows/rtl8188gu-full-package.yml"
      - "build.sh"
      - "functions.sh"
      - "configs/**"
      - "patches/**"
      - "scripts/audit-rtl8188gu-source.py"
      - "scripts/patch-rtl8188gu-monitor-injection.py"
      - "modules/RTL8188GU-KSU/**"

permissions:
  contents: read

concurrency:
  group: rtl8188gu-module-only-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Build exact r663 ABI tree and standalone B711 module
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      KERNEL_REPO: https://github.com/KRYPTAJUNO/GKI-Duchamp-6.1
      KERNEL_BRANCH_OVERRIDE: rtl8188gu-build-base-f391d5a36
      KERNEL_LOCALVERSION_OVERRIDE: -GKID-r663-f391d5a36
      KERNEL_VERSION: "6.1"
      KSU: KSU
      KSU_COMPAT: "false"
      KSU_SUSFS: "true"
      C_LTO: "false"
      No_DS: "false"
      TODO: kernel
      TEST: "no"
      LTO: fullLTO
      CLEAN_LTO_CACHE: "true"
      DROIDSPACES: "true"
      NH: "true"
      NM: "false"
      RUN_NUM: -r663-rtl8188gu
      SKIP_ANYKERNEL_PACKAGE: "true"
      RTL8XXXU_IN_TREE: "true"
      RTL8188GU_COMMIT: 9dec8292ae13c3a0dbf53eb07da6585427c8db7a
      EXPECTED_KERNEL_SOURCE: f391d5a36ae325a4f3abdf497335abae87734a05
      EXPECTED_SUSFS_VERSION: v2.3.0
      EXPECTED_LLVM_COMMIT: f42c87ba2c70219b1f4ad1f031a5b6a1ea6603fb
      KERNEL_BUILD_JOBS: "2"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout isolated full-package branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          timeout 5m sudo apt-get update -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=1
          timeout 10m sudo apt-get install -y \
            bc bison flex libdw-dev libelf-dev libssl-dev libncurses-dev \
            ccache gh dwarves cpio zip unzip zstd kmod binutils-aarch64-linux-gnu \
            gcc-aarch64-linux-gnu python3
          timeout 5m python3 -m pip install lxml

      - name: Build matching GKID r663 kernel tree for ABI metadata only (no kernel ZIP)
        id: kernel_build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./*.sh py/*.py
          export GIT_CLONE_PROTECTION_ACTIVE=false
          mkdir -p artifacts
          ./build.sh 2>&1 | tee artifacts/build.log
          ACTUAL_KERNEL_SOURCE="$(git -C ksrc rev-parse HEAD)"
          echo "Expected kernel source: $EXPECTED_KERNEL_SOURCE"
          echo "Actual kernel source:   $ACTUAL_KERNEL_SOURCE"
          test "$ACTUAL_KERNEL_SOURCE" = "$EXPECTED_KERNEL_SOURCE"
          test -s out/arch/arm64/boot/Image
          test -s ksrc/include/linux/susfs.h
          grep -Fq "#define SUSFS_VERSION \"$EXPECTED_SUSFS_VERSION\"" ksrc/include/linux/susfs.h
          export PATH="$GITHUB_WORKSPACE/neutron-clang/bin:$PATH"
          clang --version | tee artifacts/clang-version.txt
          grep -Fq "$EXPECTED_LLVM_COMMIT" artifacts/clang-version.txt
          if find artifacts -maxdepth 1 -type f -name '*.zip' -print -quit | grep -q .; then
            echo "Refusing to keep or publish a kernel ZIP in this module-only workflow"
            find artifacts -maxdepth 1 -type f -name '*.zip' -print
            exit 1
          fi
          grep -q 'CONFIG_KSU=y' out/.config
          grep -q 'CONFIG_KSU_SUSFS=y' out/.config
          grep -qx 'CONFIG_RTL8XXXU=m' out/.config
          grep -qx 'CONFIG_WLAN_VENDOR_REALTEK=y' out/.config
          grep -qx 'CONFIG_MODULES=y' out/.config
          grep -qx 'CONFIG_MODVERSIONS=y' out/.config
          grep -qx 'CONFIG_CFI_CLANG=y' out/.config
          grep -qx 'CONFIG_LTO_CLANG_FULL=y' out/.config
          grep -qx 'CONFIG_CFG80211=m' out/.config
          grep -qx 'CONFIG_MAC80211=m' out/.config
          cp out/.config artifacts/kernel-config-rtl8188gu.txt
          cp out/Module.symvers artifacts/Module.symvers
          echo "Kernel source: $(git -C ksrc rev-parse HEAD)" > artifacts/kernel-metadata-rtl8188gu.txt
          echo "Kernel release: $(make -s -C ksrc O="$GITHUB_WORKSPACE/out" kernelrelease)" >> artifacts/kernel-metadata-rtl8188gu.txt
          echo "KSU/SuSFS/Multiple-Managers: enabled by build.sh environment" >> artifacts/kernel-metadata-rtl8188gu.txt
          echo "AnyKernel3 package:" >> artifacts/kernel-metadata-rtl8188gu.txt
          find artifacts -maxdepth 1 -type f -name '*.zip' -printf '%f %s bytes\n' >> artifacts/kernel-metadata-rtl8188gu.txt

      - name: Capture kernel-build diagnostics
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          mkdir -p artifacts
          {
            echo "Build step outcome: ${{ steps.kernel_build.outcome }}"
            echo "Workflow ref: $GITHUB_REF"
            echo "Commit: $GITHUB_SHA"
            echo "Timestamp UTC: $(date -u +%FT%TZ)"
            echo
            echo "=== Disk ==="
            df -h
            echo
            echo "=== Memory ==="
            free -h
            echo
            echo "=== CPU ==="
            getconf _NPROCESSORS_ONLN
            echo
            echo "=== Workspace usage ==="
            du -sh "$GITHUB_WORKSPACE"/* 2>/dev/null | sort -h | tail -30
            echo
            echo "=== Relevant files ==="
            find artifacts out -maxdepth 3 -type f \( -name 'build.log' -o -name '.config' -o -name 'Module.symvers' -o -name 'Image' \) -printf '%p %s bytes\\n' 2>/dev/null
          } > artifacts/runner-diagnostics.txt
          test -s artifacts/build.log || echo "build.log was not created" > artifacts/build-log-missing.txt
          if [ -f out/.config ]; then cp out/.config artifacts/kernel-config-rtl8188gu.txt; fi
          if [ -f out/Module.symvers ]; then cp out/Module.symvers artifacts/Module.symvers; fi
          exit 0

      - name: Upload kernel-build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: GKID-r663-kernel-build-diagnostics
          path: |
            artifacts/build.log
            artifacts/clang-version.txt
            artifacts/runner-diagnostics.txt
            artifacts/build-log-missing.txt
            artifacts/kernel-config-rtl8188gu.txt
            artifacts/Module.symvers
            artifacts/kernel-metadata-rtl8188gu.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Audit and build pinned RTL8188GU driver with monitor mode
        shell: bash
        run: |
          set -euo pipefail
          DRIVER_DIR="$GITHUB_WORKSPACE/rtl8188gu-src"
          git clone --filter=blob:none https://github.com/lwfinger/rtl8188gu.git "$DRIVER_DIR"
          git -C "$DRIVER_DIR" checkout --detach "$RTL8188GU_COMMIT"
          test "$(git -C "$DRIVER_DIR" rev-parse HEAD)" = "$RTL8188GU_COMMIT"
          python3 scripts/patch-rtl8188gu-monitor-injection.py "$DRIVER_DIR" | tee artifacts/rtl8188gu-monitor-injection-patch.txt
          python3 scripts/audit-rtl8188gu-source.py "$DRIVER_DIR" | tee artifacts/rtl8188gu-source-audit.txt

          export PATH="$GITHUB_WORKSPACE/neutron-clang/bin:$PATH"
          make -C "$GITHUB_WORKSPACE/ksrc" \
            O="$GITHUB_WORKSPACE/out" \
            M="$DRIVER_DIR" \
            TopDIR="$DRIVER_DIR" \
            ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache clang" \
            CONFIG_RTL8710BU=m CONFIG_WIFI_MONITOR=y modules 2>&1 | tee artifacts/rtl8188gu-module-build.log

          MODULE="$DRIVER_DIR/8188gu.ko"
          test -s "$MODULE"
          test "$(modinfo -F vermagic "$MODULE" | cut -d' ' -f1)" = "6.1.177-GKID-r663-f391d5a36"
          modinfo -F alias "$MODULE" | grep -Eiq '^usb:v0BDApB711'
          test "$(modinfo -F alias "$MODULE" | wc -l)" -eq 1
          readelf -h "$MODULE" | grep -q AArch64

          # Verify every imported symbol CRC against the exact kernel build's
          # Module.symvers; vermagic alone does not prove MODVERSIONS ABI match.
          modprobe --dump-modversions "$MODULE" > artifacts/rtl8188gu-imported-symbol-crcs.txt
          python3 - "$GITHUB_WORKSPACE/out/Module.symvers" artifacts/rtl8188gu-imported-symbol-crcs.txt <<'PY'
          import sys
          from pathlib import Path

          symvers = {}
          for line in Path(sys.argv[1]).read_text().splitlines():
              fields = line.split()
              if len(fields) >= 2:
                  symvers[fields[1]] = fields[0].lower()

          imports = []
          for line in Path(sys.argv[2]).read_text().splitlines():
              fields = line.split()
              if len(fields) >= 2:
                  imports.append((fields[1], fields[0].lower()))

          if not imports:
              raise SystemExit("FAIL: module has no MODVERSIONS import records")
          errors = []
          for symbol, crc in imports:
              expected = symvers.get(symbol)
              if expected is None:
                  errors.append(f"{symbol}: missing from exact kernel Module.symvers")
              elif expected != crc:
                  errors.append(f"{symbol}: module={crc}, kernel={expected}")
          if errors:
              print("\n".join(errors))
              raise SystemExit(f"FAIL: {len(errors)} symbol CRC mismatch(es)")
          print(f"PASS: all {len(imports)} imported symbol CRCs match exact kernel Module.symvers")
          PY

          strings "$MODULE" | grep -q rtw_cfg80211_monitor_if_xmit_entry
          strings "$MODULE" | grep -q cfg80211_rtw_set_monitor_channel
          mkdir -p modules/RTL8188GU-KSU/lkm
          cp "$MODULE" modules/RTL8188GU-KSU/lkm/8188gu.ko

          # Package only the B711-specific driver. Never bundle a replacement
          # cfg80211/mac80211 module that could conflict with the running Wi-Fi stack.

          {
            echo "Kernel release: $(make -s -C ksrc O="$GITHUB_WORKSPACE/out" kernelrelease)"
            echo "Driver source commit: $RTL8188GU_COMMIT"
            echo "Module vermagic: $(modinfo -F vermagic "$MODULE")"
            echo "USB aliases:"
            modinfo -F alias "$MODULE"
            echo "Dependencies: $(modinfo -F depends "$MODULE")"
            echo "Firmware: embedded in driver source (LOAD_FW_HEADER_FROM_DRIVER)"
            echo "Monitor interface: source audit + compiled monitor TX/channel symbols present"
            echo "Packet injection: patched TX path supports management frames and simple 3-address non-QoS data; QoS/WDS/control injection unsupported; hardware runtime test still required"
            echo "Existing modules unloaded/replaced by installer: none"
          } | tee artifacts/rtl8188gu-module-metadata.txt

          chmod 0755 modules/RTL8188GU-KSU/post-fs-data.sh
          sed -i "s/^version=.*/version=0.1.0-$(date +%Y%m%d)-r663/" modules/RTL8188GU-KSU/module.prop
          (cd modules/RTL8188GU-KSU && zip -9 -r "$GITHUB_WORKSPACE/artifacts/RTL8188GU-KSU-6.1.177-GKID-r663.zip" .)

          cd artifacts
          sha256sum *.zip > SHA256SUMS
          md5sum *.zip > MD5SUMS

      - name: Upload standalone B711 KernelSU module and ABI evidence
        uses: actions/upload-artifact@v4
        with:
          name: GKID-r663-RTL8188GU-standalone-module
          path: |
            artifacts/RTL8188GU-KSU-6.1.177-GKID-r663.zip
            artifacts/SHA256SUMS
            artifacts/MD5SUMS
            artifacts/kernel-config-rtl8188gu.txt
            artifacts/Module.symvers
            artifacts/kernel-metadata-rtl8188gu.txt
            artifacts/rtl8188gu-module-metadata.txt
            artifacts/rtl8188gu-source-audit.txt
            artifacts/rtl8188gu-monitor-injection-patch.txt
            artifacts/rtl8188gu-module-build.log
            artifacts/build.log
          if-no-files-found: error
          retention-days: 14
# Manual dispatch/push validation checkpoint: rebuild exact r663 ABI and B711 module.
